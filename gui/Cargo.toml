[package]
name = "padc-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Interface gráfica (Iced) para o PADC — conversor de dados dos *.txt do SIAPC/PAD para DuckDB"
authors = ["Everton da Rosa <everton3x@gmail.com>"]
license = "MIT"
publish = false

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }

[profile.release]
lto = "thin"
strip = true
